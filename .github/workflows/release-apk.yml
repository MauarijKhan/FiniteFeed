# Every push to main: run the tests, build the finished Finite Feed app (signed, shrunk), and publish it as a GitHub Release.
name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FiniteFeed

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FEEDCAP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::FEEDCAP_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/feedcap-ci.keystore"
          echo "FEEDCAP_KEYSTORE=$RUNNER_TEMP/feedcap-ci.keystore" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          FEEDCAP_KEYSTORE_PASSWORD: ${{ secrets.FEEDCAP_KEYSTORE_PASSWORD }}
          FEEDCAP_KEY_ALIAS: ${{ secrets.FEEDCAP_KEY_ALIAS }}
          FEEDCAP_KEY_PASSWORD: ${{ secrets.FEEDCAP_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Name the APK
        id: apk
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          name="FiniteFeed-${version}-build-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$name"
          echo "path=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          short="${GITHUB_SHA::7}"
          {
            echo "Finite Feed ${{ steps.apk.outputs.version }}, build ${GITHUB_RUN_NUMBER} (${short})."
            echo
            echo "Download the APK below and open it on your Android phone. Each build installs as an update to the last."
            echo
            echo "### Changes"
            echo "${COMMIT_MSG:-Manual run}"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" "${{ steps.apk.outputs.path }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Finite Feed ${{ steps.apk.outputs.version }} (build ${GITHUB_RUN_NUMBER})" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
